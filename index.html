<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Ride - Közös Utazás</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigáció -->
    <header>
        <div class="logo">🚗 CampusRide</div>
        <nav>
            <a href="#jaratok">Járatok</a>
            <a href="#hirdetes">Járat Indítása</a>
        </nav>
    </header>

    <!-- Hero / Fejléc szekció -->
    <section class="hero">
        <h1>Ugorj be valaki mellé, vagy oszd meg a verdád!</h1>
        <p>Spórolj a benzinen és érj be időben a suliba / munkába.</p>
    </section>

    <!-- Járat Keresés & Listázás -->
    <main class="container">
        <section id="jaratok" class="card">
            <h2>Elérhető Járatok</h2>
            <div id="ride-list" class="ride-grid">
            
            </div>
        </section>

        
        <section id="hirdetes" class="card">
            <h2>Új Járat Indítása</h2>
            <form id="add-ride-form">
                <div class="form-group">
                    <label for="driver">Sofőr neve:</label>
                    <input type="text" id="driver" required placeholder="Pl. Teszt Elek">
                </div>
                <div class="form-group">
                    <label for="from">Honnan:</label>
                    <input type="text" id="from" required placeholder="Pl. Debrecen, Tócóskert">
                </div>
                <div class="form-group">
                    <label for="to">Hová:</label>
                    <input type="text" id="to" required placeholder="Pl. Mechwart / Campus">
                </div>
                <div class="form-group">
                    <label for="seats">Szabad helyek száma:</label>
                    <input type="number" id="seats" min="1" max="8" value="3" required>
                </div>
                <button type="submit" class="btn">Járat Meghirdetése</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Campus Ride Team - Projektmunka</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
